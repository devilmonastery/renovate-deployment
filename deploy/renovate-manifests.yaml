# Source: renovate/templates/cronjob.yaml
apiVersion: batch/v1
kind: CronJob
metadata:
  name: renovate
  namespace: renovate
  labels:
    helm.sh/chart: renovate-44.15.1
    app.kubernetes.io/name: renovate
    app.kubernetes.io/instance: renovate
    app.kubernetes.io/version: "41.140.1"
    app.kubernetes.io/managed-by: Helm
  annotations:
    app.kubernetes.io/managed-by: ArgoCD
spec:
  schedule: "0 2 * * *"
  timeZone: UTC
  jobTemplate:
    metadata:
      labels:
        app.kubernetes.io/name: renovate
        app.kubernetes.io/instance: renovate
    spec:
      template:
        metadata:
          labels:
            app.kubernetes.io/name: renovate
            app.kubernetes.io/instance: renovate
        spec:
          serviceAccountName: renovate
          restartPolicy: Never
          initContainers:
            - name: netrc
              image: "registry.local.rothwell.us/devilmonastery/renovate-worker:44.33.2-worker-2"
              imagePullPolicy: IfNotPresent
              command:
                - sh
                - -c
                - |
                  printf 'machine github.com\nlogin x-oauth-basic\npassword %s\nmachine api.github.com\nlogin x-oauth-basic\npassword %s\n' "$GITHUB_TOKEN" "$GITHUB_TOKEN" > /netrc/.netrc && chmod 600 /netrc/.netrc
              env:
                - name: GITHUB_TOKEN
                  valueFrom:
                    secretKeyRef:
                      key: token
                      name: renovate-github-token
              securityContext:
                capabilities:
                  drop:
                  - ALL
                runAsGroup: 1000
                runAsNonRoot: true
                runAsUser: 1000
                seccompProfile:
                  type: RuntimeDefault
              resources:
                limits:
                  cpu: 100m
                  memory: 64Mi
                requests:
                  cpu: 10m
                  memory: 32Mi
              volumeMounts:
                - name: netrc
                  mountPath: /netrc
          containers:
            - name: renovate
              image: "registry.local.rothwell.us/devilmonastery/renovate-worker:44.33.2-worker-2"
              imagePullPolicy: IfNotPresent
              volumeMounts:
                - name: config-volume
                  mountPath: /usr/src/app/config.json
                  subPath: config.json
                - name: netrc
                  mountPath: /home/ubuntu/.netrc
                  subPath: .netrc
              env:
                - name: RENOVATE_CONFIG_FILE
                  value: /usr/src/app/config.json
                - name: RENOVATE_TOKEN
                  valueFrom:
                    secretKeyRef:
                      key: token
                      name: renovate-github-token
                - name: GITHUB_TOKEN
                  valueFrom:
                    secretKeyRef:
                      key: token
                      name: renovate-github-token
                - name: GOPRIVATE
                  value: github.com/devilmonastery/*,github.snooguts.net/*
              envFrom:
              securityContext:
                capabilities:
                  drop:
                  - ALL
                runAsGroup: 1000
                runAsNonRoot: true
                runAsUser: 1000
                seccompProfile:
                  type: RuntimeDefault
              resources:
                limits:
                  cpu: 2000m
                  memory: 4Gi
                requests:
                  cpu: 500m
                  memory: 1Gi
          volumes:
            - name: config-volume
              secret:
                secretName: renovate-config
            - name: netrc
              emptyDir: {}
