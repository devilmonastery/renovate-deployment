stringData:
  config.json: |-
    {
      "platform": "github",
      "endpoint": "https://api.github.com/",
      "autodiscover": false,
      "repositories": [
        "devilmonastery/argo-root",
        "devilmonastery/configs",
        "devilmonastery/daisybot",
        "devilmonastery/dashboards",
        "devilmonastery/env-k8s-home",
        "devilmonastery/financial-exporter",
        "devilmonastery/hivemind",
        "devilmonastery/homewiki",
        "devilmonastery/infracode",
        "devilmonastery/kube-web-view",
        "devilmonastery/renovate-deployment"
      ],
      "onboarding": false,
      "requireConfig": "optional",
      "gitAuthor": "Renovate Bot <renovate@devilmonastery.com>",
      "timezone": "UTC",
      "dependencyDashboard": false,
      "suppressNotifications": ["prIgnoreNotification"],
      "prHourlyLimit": 2,
      "prConcurrentLimit": 4,
      "allowShellExecutorForPostUpgradeCommands": true,
      "allowedCommands": [
        "^test -n \"\\$\\{GITHUB_TOKEN",
        "^GOPRIVATE='github\\.com/devilmonastery/\\*,github\\.snooguts\\.net/\\*' make generate$"
      ],
      "commitMessagePrefix": "chore:",
      "semanticCommits": "enabled",
      "enabledManagers": ["dockerfile", "docker-compose", "github-actions", "gomod", "helm-values", "helmv3", "kubernetes"],
      "gitIgnoredAuthors": ["noreply@github.com"],
      "packageRules": [
        {
          "description": "Group Helm chart updates",
          "matchManagers": ["helmv3", "helm-values"],
          "groupName": "helm charts",
          "commitMessageTopic": "{{groupName}}"
        },
        {
          "description": "Group Docker image updates",
          "matchManagers": ["dockerfile", "docker-compose"],
          "groupName": "docker images",
          "commitMessageTopic": "{{groupName}}"
        },
        {
          "description": "Group GitHub Actions updates",
          "matchManagers": ["github-actions"],
          "groupName": "github actions",
          "commitMessageTopic": "{{groupName}}"
        },
        {
          "description": "Trusted packages - create PRs for manual review",
          "matchPackagePatterns": [
            "^prometheus-community/",
            "^traefik/",
            "^jetstack/",
            "^metallb/"
          ],
          "matchUpdateTypes": ["minor", "patch"],
          "automerge": false,
          "reviewersFromCodeOwners": true
        },
        {
          "description": "Infracode dependencies require manual review",
          "matchManagers": ["gomod"],
          "matchPackageNames": [
            "github.com/devilmonastery/infracode",
            "github.com/devilmonastery/env-k8s-home"
          ],
          "automerge": false
        }
      ],
      "gomod": {
        "fileMatch": ["(^|/)go\\.mod$"]
      },
      "helm-values": {
        "fileMatch": ["(^|/)values\\.ya?ml$"]
      },
      "kubernetes": {
        "fileMatch": ["(^|/)[^/]*\\.ya?ml$"],
        "ignorePaths": [
          "**/secrets/**"
        ]
      }
    }
